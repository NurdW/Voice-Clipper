# Workspace: the CLI lives at the repo root, the power-toggle GUI in gui/.
[workspace]
members = [".", "gui"]
default-members = [".", "gui"]

[package]
name = "clipper"
version = "2.0.0"
license = "GPL-3.0-or-later"
edition = "2024"
description = "Voice-triggered game clipping: saves the OBS replay buffer when you say one of your phrases. Fully offline."

[[bin]]
name = "clipctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# Only used to install SIGINT/SIGTERM handlers in the listener.
libc = "0.2"
# Vosk prints one JSON object per recognition; that is all we parse.
serde_json = "1"

[dev-dependencies]
tempfile = "3"

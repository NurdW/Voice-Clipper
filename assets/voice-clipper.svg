<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Voice Clipper mark: red V, white C, offset and overlapping.
       Each letter is drawn twice — a wide dark-grey pass under a narrower
       coloured one — so both read on light and dark taskbars, and the outline
       is what separates them where they cross. The C is painted last so it
       sits in front of the V's right arm.
       Render PNGs with `-background none` or ImageMagick flattens white. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 12 56 72 96 12" stroke="#2f3235" stroke-width="21"/>
    <path d="M92 68A26 26 0 1 0 92 104" stroke="#2f3235" stroke-width="21"/>
    <path d="M16 12 56 72 96 12" stroke="#ff1f1f" stroke-width="13"/>
    <path d="M92 68A26 26 0 1 0 92 104" stroke="#ffffff" stroke-width="13"/>
  </g>
</svg>
